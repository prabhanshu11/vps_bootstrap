name: Deploy wg-vdi relay

on:
  push:
    branches: [main]
    paths: ['wireguard/**', 'scripts/setup-wireguard.sh', '.github/workflows/wireguard.yml']
  workflow_dispatch:

jobs:
  wireguard:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to the VPS and run scripts/setup-wireguard.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          WG_VDI_VPS_KEY: ${{ secrets.WG_VDI_VPS_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          printf '%s' "$WG_VDI_VPS_KEY" | ssh root@"$VPS_HOST" \
            'cd /root/vps_bootstrap && git fetch -q origin && git reset -q --hard origin/main && ./scripts/setup-wireguard.sh'
